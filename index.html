<style>
:root{--p:#0790AC;--pd:#056b80;--pl:rgba(7,144,172,.12);--tx:#1f2937;--mu:#6b7280;--rd:#dc2626}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:var(--tx);background:linear-gradient(135deg,#e0eafc,#cfdef3);background-attachment:fixed;display:flex;flex-direction:column;gap:12px;padding:12px;overflow:hidden}
.glass{background:rgba(255,255,255,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 32px rgba(7,144,172,.1);border-radius:16px}
button{font-family:inherit;cursor:pointer}
.ib{border:0;background:transparent;color:var(--tx);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.ib:hover{background:var(--pl);color:var(--pd)}
.ib.pri{background:var(--p);color:#fff}.ib.pri:hover{background:var(--pd);color:#fff}
.ib.dng{color:var(--rd)}.ib.dng:hover{background:rgba(220,38,38,.1);color:var(--rd)}
.ib:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.ib.sm{padding:4px 8px;font-size:12px;border-radius:8px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ib.sm .i,.d .ed .i{width:15px;height:15px}
.emp .big{width:40px;height:40px;opacity:.45;margin-bottom:6px}
.hs{border:0;background:rgba(255,255,255,.65);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;font-weight:600;color:var(--tx);cursor:pointer}
.tabs.ph{flex-wrap:wrap;overflow:visible}
.pg{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border:1px solid transparent;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.pg.on{border-color:var(--p);background:var(--pl);color:var(--pd)}
.pg span{flex:1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f2a3a;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:60;max-width:90vw}
nav{display:flex;flex-direction:column;gap:8px;padding:10px 16px}
.tb1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tb2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;direction:ltr}
.tb2>:first-child{justify-self:start}.tb2>:last-child{justify-self:end}
.mid{display:flex;gap:28px}
.tb2 .ib,.tb1 .ib{direction:rtl}
.row.hm aside{display:none}
.mh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.6)}
.mh .tabs{flex:1;min-width:0;padding:0;border:0}
#bT{position:relative;z-index:5}
.sh-end{margin-inline-start:auto;display:flex;align-items:center;gap:4px;flex-shrink:0}
.scn{position:relative}
.scn .menu{left:0;right:auto;min-width:155px}
.sh:has(.sx.open) #srt,.sh:has(.sx.open) #selBtn,.sh:has(.sx.open) .scn{display:none}
.bkh{position:fixed;left:0;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;background:rgba(15,42,58,.85);color:#fff;display:grid;place-items:center;z-index:80;pointer-events:none;animation:bkh .65s ease forwards}
.bkh .i{width:24px;height:24px;stroke-width:2.2}
@keyframes bkh{0%{transform:translateX(-60px);opacity:0}35%{transform:translateX(18px);opacity:1}70%{transform:translateX(18px);opacity:1}100%{transform:translateX(-60px);opacity:0}}
@keyframes sin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
aside{animation:sin .3s ease}
.tb3{overflow-x:auto}
@media(max-width:800px){.tb3{flex-wrap:nowrap;gap:4px}.tb3 .ib{flex:1 1 auto;min-width:0;justify-content:center;padding:7px 3px;font-size:11.5px;gap:3px;white-space:nowrap}.tb3 .i{width:14px;height:14px}}
@media(max-width:380px){.tb3 .ib{font-size:10.5px;padding:7px 2px;gap:2px}.tb3 .i{width:13px;height:13px}}
.etag{direction:ltr;display:flex;margin-bottom:-16px;padding-left:16px;position:relative;z-index:1}
.etag span{background:#d97706;color:#fff;font-size:12px;font-weight:700;padding:3px 14px 4px;border-radius:10px 10px 0 0;direction:rtl}
.ro select:disabled{color:inherit;opacity:1}
.ro .edt,aside.ro .edt{display:none!important}
.tb3{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.6);padding-top:8px}
.tb3 .ib.pri .i{color:#fff}
.hmg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:6px}
.hc{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.6);border-radius:16px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--tx);transition:.2s;position:relative}
.hc:hover{background:#fff;border-color:var(--p);transform:translateY(-2px)}
.hc .i{width:38px;height:38px;color:var(--p);stroke-width:1.5}
.hc em.bdg{margin:0}
.ab{padding:16px;line-height:2;font-size:14px}
@media(max-width:800px){.hmg{grid-template-columns:1fr}}
.logo{font-weight:800;font-size:18px;color:var(--p);display:flex;align-items:center;gap:8px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-style:normal}
.logo-img{width:38px;height:38px;border-radius:10px;object-fit:contain;background:#fff;padding:2px;box-shadow:0 2px 8px rgba(7,144,172,.18);flex-shrink:0}
.logo-t{display:flex;flex-direction:column;line-height:1.15}
.fac-sub{font-size:11.5px;font-weight:700;color:var(--pd);opacity:.9;margin-top:2px}
.fac-sub:empty{display:none}
.mods{display:flex;gap:6px;margin-inline-start:14px}
.mod{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--mu)}
.mod.on{background:var(--p);color:#fff}.mod:disabled{opacity:.5;cursor:default}
.sp{flex:1}
.mnav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.5);border-radius:12px;padding:3px 6px}
.mnav b{min-width:120px;text-align:center;font-size:14px}
.mnav button{border:0;background:transparent;font-size:18px;color:var(--p);padding:0 8px;border-radius:8px}
.mnav button:hover{background:var(--pl)}
.row{display:flex;gap:12px;flex:1;min-height:0}
aside{width:290px;flex-shrink:0;display:flex;flex-direction:column;min-height:0}
.sh{padding:14px;border-bottom:1px solid rgba(255,255,255,.6);display:flex;align-items:center;gap:8px}
.sh h3{margin:0;font-size:15px;flex:1}
#dl{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.d{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.4);border:1px solid transparent;cursor:pointer;transition:.2s;font-weight:600;font-size:14px}
.d:hover{background:rgba(255,255,255,.7)}
.d.on{background:var(--p);color:#fff;box-shadow:0 4px 14px rgba(7,144,172,.35)}
.d .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.d small{font-weight:500;opacity:.8;font-size:11px;flex-shrink:0}
.d .ed{border:0;background:transparent;color:inherit;opacity:.65;font-size:14px;padding:2px 4px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}.d .ed:hover{opacity:1}
.d .ed.dng:hover{color:var(--rd)}.d.on .ed.dng:hover{color:#fecaca}
.d .chk{width:16px;height:16px;accent-color:var(--p);cursor:pointer;flex-shrink:0;margin:0}
.d.on .chk{accent-color:#fff}
.rno{font-size:11px;font-weight:700;background:var(--pl);color:var(--pd);padding:2px 6px;border-radius:7px;flex-shrink:0;direction:ltr}
.d.on .rno{background:rgba(255,255,255,.22);color:#fff}
.d.emp-c{flex-wrap:wrap;row-gap:4px}
.cacts{flex-basis:100%;display:flex;align-items:center;gap:4px;padding-top:4px;border-top:1px solid rgba(7,144,172,.14)}
.d.on .cacts{border-top-color:rgba(255,255,255,.25)}
.cacts .cbtn{padding:4px 7px;border-radius:8px;color:var(--pd);background:rgba(255,255,255,.55)}
.cacts .cbtn:hover{background:#fff;color:var(--p)}
.cacts .cbtn.wa{color:#15803d}.cacts .cbtn.wa:hover{background:#dcfce7;color:#15803d}
.d.on .cacts .cbtn{color:#fff;background:rgba(255,255,255,.16)}
.d.on .cacts .cbtn:hover{background:rgba(255,255,255,.3);color:#fff}
.cacts .lvbtn{margin-inline-start:auto;color:#b45309;background:rgba(254,243,199,.8)}
.cacts .lvbtn:hover{background:#fef3c7;color:#92400e}
.d.on .cacts .lvbtn{color:#fff;background:rgba(255,255,255,.22)}
.d.on .cacts .lvbtn:hover{background:rgba(255,255,255,.36);color:#fff}
.lv-pick{display:flex;align-items:center;gap:6px}
.lv-pick select{flex:1;min-width:0}
.lv-pick .sq{border:1px solid #cbd5e1;background:#fff;height:40px;width:40px}
.cbtn.dim{opacity:.45}
.pacts{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;padding:8px 14px;background:rgba(255,255,255,.48);border-bottom:1px solid rgba(7,144,172,.14)}
.pacts .cbtn{background:rgba(255,255,255,.85);border:1px solid rgba(7,144,172,.2);color:var(--pd);padding:5px 10px;border-radius:10px;font-size:12px}
.pacts .cbtn:hover{background:var(--p);color:#fff;border-color:var(--p)}
.pacts .cbtn.wa{color:#15803d;border-color:rgba(21,128,61,.25)}
.pacts .cbtn.wa:hover{background:#16a34a;color:#fff;border-color:#16a34a}
.mdays{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mdays label{display:inline-flex!important;align-items:center;gap:5px;margin:0!important;padding:5px 10px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer;transition:.15s}
.mdays label:has(input:checked){background:var(--p);color:#fff;border-color:var(--p)}
.mdays input{width:auto!important;margin:0;accent-color:#fff}
.sf{padding:10px;border-top:1px solid rgba(255,255,255,.6);display:flex;gap:6px;flex-wrap:wrap}
main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.6);align-items:center}
.tab{border:0;background:rgba(255,255,255,.4);padding:7px 16px;border-radius:10px;font-weight:600;font-size:13px;color:var(--tx);white-space:nowrap}

async function doFbLogin(){
  const email=gv('fb_email').trim(),pass=gv('fb_pass'),er=document.getElementById('fb_err'),btn=document.getElementById('fb_go');
  if(!email||!/^\S+@\S+\.\S+$/.test(email)){er.textContent='يرجى إدخال البريد الإلكتروني بشكل صحيح';return}
  if(!pass){er.textContent='يرجى إدخال كلمة السر';return}
  er.textContent='';if(btn)btn.disabled=true;
  try{
    if(FB.apiKey&&FB.url){
      const res=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(FB.apiKey),{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email,password:pass,returnSecureToken:true})
      });
      const j=await res.json();
      if(!res.ok){
        const code=(j.error&&j.error.message)||'';
        const map={'CONFIGURATION_NOT_FOUND':'يرجى تفعيل Authentication ← Email/Password في لوحة تحكم Firebase أولاً','INVALID_LOGIN_CREDENTIALS':'البريد الإلكتروني أو كلمة السر غير صحيحة','EMAIL_NOT_FOUND':'هذا البريد غير مسجل في Firebase Authentication','INVALID_PASSWORD':'كلمة السر غير صحيحة','USER_DISABLED':'تم تعطيل هذا الحساب في Firebase','TOO_MANY_ATTEMPTS_TRY_LATER':'محاولات كثيرة خاطئة — حاول بعد قليل'};
        throw new Error(map[code]||code||'بيانات الدخول إلى Firebase غير صحيحة');
      }
      FB.token=j.idToken||'';
      FB.refreshToken=j.refreshToken||'';
      FB.email=email;
      saveFbCfg();
      await syncFromFirebase();
    }else if(FB.url){
      FB.email=email;saveFbCfg();
      await syncFromFirebase();
    }else{
      FB.email=email;saveFbCfg();
    }
    closeM();
    openAuthModal(2);
  }catch(err){
    er.textContent=err.message||'تعذر تسجيل الدخول إلى Firebase';
    if(btn)btn.disabled=false;
  }
}
function openFbConfigModal(){
  if(!guard('full','إعدادات Firebase متاحة فقط لصلاحية التحكم الكلي'))return;
  modal(`<h3>${ic('db')} إعدادات ربط Firebase</h3>
    <label>رابط قاعدة البيانات (databaseURL)</label>
    <input id="fb_url" dir="ltr" value="${esc(FB.url||'')}" placeholder="https://your-project-default-rtdb.firebaseio.com">
    <div class="fg">
      <div><label>مفتاح المشروع (apiKey)</label><input id="fb_key" dir="ltr" value="${esc(FB.apiKey||'')}" placeholder="AIzaSy..."></div>

function parseFbPaste(txt){
  const u=String(txt||'').match(/https:\/\/[a-zA-Z0-9._-]+(?:firebaseio\.com|firebasedatabase\.app)[^\s"']*/);

  if(u){const el=document.getElementById('fb_url');if(el)el.value=u[0].replace(/\/+$/,'')}
  if(k){const el=document.getElementById('fb_key');if(el)el.value=k[1]}

    S.users=S.users.filter(x=>x.id!==id);

}

function calcQibla(lat,lng){
  const r=Math.PI/180,p1=lat*r,p2=21.4225*r,dl=(39.8262-lng)*r;
  const y=Math.sin(dl),x=Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl);
  return (Math.atan2(y,x)/r+360)%360;
}
function calcPrayers(date,lat,lng){
  const rad=Math.PI/180,deg=180/Math.PI;
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const jd=(()=>{let Y=y,M=m;if(M<=2){Y-=1;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5})();
  const D=jd-2451545.0;
  const g=(357.529+0.98560028*D)%360,q=(280.459+0.98564736*D)%360;
  const L=(q+1.915*Math.sin(g*rad)+0.020*Math.sin(2*g*rad))%360;
  const e=23.439-0.00000036*D;
  const RA=Math.atan2(Math.cos(e*rad)*Math.sin(L*rad),Math.cos(L*rad))*deg/15;
  const eqt=q/15-((RA+24)%24);
  const decl=Math.asin(Math.sin(e*rad)*Math.sin(L*rad))*deg;
  const tz=HLOC.tz!=null?HLOC.tz:(-date.getTimezoneOffset()/60);
  const dhuhr=12+tz-lng/15-eqt;
  const ha=ang=>{
    const c=(Math.sin(ang*rad)-Math.sin(lat*rad)*Math.sin(decl*rad))/(Math.cos(lat*rad)*Math.cos(decl*rad));
    if(c>1||c<-1)return 0;
    return Math.acos(c)*deg/15;
  };
  const sunrise=dhuhr-ha(-0.833);
  const maghrib=dhuhr+ha(-0.833);
  const fajr=dhuhr-ha(-18);
  const isha=dhuhr+ha(-17.5);
  const asrAlt=Math.atan(1/(1+Math.tan(Math.abs(lat-decl)*rad)))*deg;
  const asr=dhuhr+ha(asrAlt);
  const toMin=h=>{let m=Math.round(((h%24)+24)%24*60);return m%1440};
  return [
    {k:'fajr',n:'الفجر',m:toMin(fajr),isP:1},
    {k:'sunrise',n:'الشروق',m:toMin(sunrise),isP:0},
    {k:'dhuhr',n:'الظهر',m:toMin(dhuhr),isP:1},
    {k:'asr',n:'العصر',m:toMin(asr),isP:1},
    {k:'maghrib',n:'المغرب',m:toMin(maghrib),isP:1},
    {k:'isha',n:'العشاء',m:toMin(isha),isP:1}
  ];
}
function fmtMin12(m){
  const h24=Math.floor(m/60)%24,mm=m%60,ap=h24>=12?'م':'ص',h12=h24%12||12;
  return ar(`${pad(h12)}:${pad(mm)}`)+' '+ap;
}
function fmtCountdown(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return ar(`${pad(h)}:${pad(m)}:${pad(s)}`);
}
function activeDivInfo(divs,nowDate){
  if(!divs||!divs.length)return null;
  const curSec=nowDate.getHours()*3600+nowDate.getMinutes()*60+nowDate.getSeconds();
  for(const d of divs){
    const s=tm(d.from)*60,e=tm(d.to)*60;
    if(s<e){
      if(curSec>=s&&curSec<e)return {div:d,remSec:e-curSec};
    }else if(s>e){
      if(curSec>=s)return {div:d,remSec:(86400-curSec)+e};
      if(curSec<e)return {div:d,remSec:e-curSec};
    }else{
      return {div:d,remSec:86400-curSec};
    }
  }
  return {div:divs[0],remSec:0};
}
function getOnDutySnapshot(nowDate){
  const y=nowDate.getFullYear(),m=nowDate.getMonth(),k=dk(nowDate),wd=dayName(nowDate);
  const empOnly=isEmpOnly(),mc=myEmpCat();
  const progsByCat={};
  S.programs.filter(p=>p.y===y&&p.m===m).forEach(p=>{
    if(empOnly&&mc&&recCat(p)!==mc)return;
    const prev=progsByCat[p.cat];
    if(!prev||(p.status==='approved'&&prev.status!=='approved')||(p.status===prev.status&&p.no>prev.no))progsByCat[p.cat]=p;
  });
  const activeProgs=Object.values(progsByCat);
  const todayIds=new Set(),nowIds=new Set(),leaveIds=new Set();
  const deptGroups=[];
  let primaryDiv=null;
  activeProgs.forEach(P=>{
    const L=Lview(P,k),info=activeDivInfo(L.divs,nowDate);
    if(info&&!primaryDiv)primaryDiv=info;
    (P.wd[wd]||[]).filter(exists).forEach(id=>{
      const lv=onLeave(P,id,k);
      if(lv&&lv.effType!=='delay'){leaveIds.add(id);if(lv.sub&&exists(lv.sub))todayIds.add(lv.sub)}
      else todayIds.add(id);
    });
    if(info){
      L.depts.forEach(dep=>{
        const list=[],seen=new Set();
        dep.rows.forEach(r=>{
          const a=r.c[info.div.id];if(!a||!exists(a))return;
          const w=effOf(P,k,a);if(!w||!exists(w)||seen.has(w))return;
          seen.add(w);nowIds.add(w);todayIds.add(w);
          const emp=S.nurses.find(x=>x.id===w);if(emp)list.push(emp);
        });
        if(list.length)deptGroups.push({dept:dep.name,list});
      });
    }
  });
  return {hasProgs:activeProgs.length>0,primaryDiv,todayCount:todayIds.size,nowCount:nowIds.size,leaveCount:leaveIds.size,deptGroups};
}

function homeHtml(){
  const d=new Date(),logged=!!curUser();
  const h24=d.getHours(),ap=h24>=12?'م':'ص',h12=h24%12||12;
  const clkTxt=`${ar(pad(h12))}:${ar(pad(d.getMinutes()))}:${ar(pad(d.getSeconds()))} ${ap}`;
  const gregTxt=`${dayName(d)}، ${ar(d.getDate())} ${MONTHS[d.getMonth()]} ${ar(d.getFullYear())}`;
  let hijriTxt='';
  try{hijriTxt=new Intl.DateTimeFormat('ar-SA-u-ca-islamic',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){}
  const snap=logged?getOnDutySnapshot(d):null;
  const divHdr=snap&&snap.primaryDiv?`<em class="bdg" dir="ltr">${dLab(snap.primaryDiv.div)}</em><em class="bdg warn">المتبقي: <span id="h_div_rem" dir="ltr">${fmtCountdown(snap.primaryDiv.remSec)}</span></em>`:'';
  const onDutyBody=!logged?`<div class="emp" style="padding:20px 10px">يرجى تسجيل الدخول لعرض العناصر على رأس عملهم.<br><br><button class="ib pri sm" onclick="loginBtn()">تسجيل الدخول</button></div>`:
    !snap.hasProgs?`<div class="emp" style="padding:20px 10px">لا يوجد برنامج شهري مضاف لشهر ${MONTHS[d.getMonth()]} ${ar(d.getFullYear())} بعد.<br><br><button class="ib pri sm" onclick="openPrograms()">فتح البرنامج الشهري</button></div>`:
    !snap.deptGroups.length?`<div class="emp" style="padding:20px 10px">لا توجد عناصر مسندة في التقسيمة الحالية (${snap.primaryDiv?dLab(snap.primaryDiv.div):'—'}).</div>`:
    snap.deptGroups.map(g=>`<div class="od-dept"><div class="od-dt"><span>${esc(g.dept)}</span><span>${ar(g.list.length)}</span></div>${g.list.map(emp=>`<div class="od-row"><span class="rno">#${ar(emp.no)}</span><span class="nm">${esc(emp.name)}</span><div class="acts">${commBtns(emp,0)}</div></div>`).join('')}</div>`).join('');

  return `<div class="hdash">
    <div class="hcard c4"><div class="ch">${ic('cal')} الساعة والتاريخ</div><div class="cb">
      <div class="clk-time" id="h_clk">${clkTxt}</div>
      <div class="clk-date" id="h_gdt">${gregTxt}</div>
      ${hijriTxt?`<div class="clk-hijri">${hijriTxt}</div>`:''}
    </div></div>

    <div class="hcard c8"><div class="ch">${ic('user')} عدد العناصر المداومة اليوم (${dayName(d)})</div><div class="cb">
      ${!logged?`<div class="emp" style="padding:14px 10px">سجّل الدخول لعرض إحصائيات المداومين اليوم.</div>`:`<div class="stat-grid">
        <div class="stat-b"><b>${ar(snap.nowCount)}</b><small>على رأس عملهم الآن</small></div>
        <div class="stat-b"><b>${ar(snap.todayCount)}</b><small>إجمالي مداومي اليوم</small></div>
        <div class="stat-b"><b style="color:${snap.leaveCount?'#b45309':'var(--p)'}">${ar(snap.leaveCount)}</b><small>في إجازة اليوم</small></div>
      </div>`}
    </div></div>

    <div class="hcard c12"><div class="ch">${ic('hosp')} العناصر على رأس عملهم حالياً حسب القسم والوقت <span style="flex:1"></span>${divHdr}</div><div class="cb">${onDutyBody}</div></div>

    <div class="hcard c6"><div class="ch">${ic('cal')} التقويم الميلادي</div><div class="cb">${gregCalHtml()}</div></div>

  </div>`;
}
function stopHomeTick(){if(_homeTick){clearInterval(_homeTick);_homeTick=null}}
function startHomeTick(){
  stopHomeTick();
  _homeTick=setInterval(()=>{
    if(U.view!=='home'){stopHomeTick();return}
    const d=new Date(),h24=d.getHours(),ap=h24>=12?'م':'ص',h12=h24%12||12;
    const clk=document.getElementById('h_clk');
    if(clk)clk.textContent=`${ar(pad(h12))}:${ar(pad(d.getMinutes()))}:${ar(pad(d.getSeconds()))} ${ap}`;
    const dr=document.getElementById('h_div_rem');
    if(dr&&curUser()){
      const snap=getOnDutySnapshot(d);
      if(snap.primaryDiv){
        dr.textContent=fmtCountdown(snap.primaryDiv.remSec);
        if(snap.primaryDiv.remSec<=1)render();
      }
    }
    const ps=calcPrayers(d,HLOC.lat,HLOC.lng),curSec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
    let nxt=ps.find(p=>p.isP&&p.m*60>curSec),remSec=0;
    if(nxt)remSec=nxt.m*60-curSec;else{nxt=ps[0];remSec=(86400-curSec)+nxt.m*60}
    const pr=document.getElementById('h_pr_rem'),pn=document.getElementById('h_pr_n'),pa=document.getElementById('h_pr_alrt'),pat=document.getElementById('h_pr_alrt_t');
    if(pr)pr.textContent=fmtCountdown(remSec);
    if(pn)pn.textContent=nxt.n;
    const near=remSec<=15*60;
    if(pa)pa.style.display=near?'flex':'none';
    if(pat&&near)pat.textContent=`اقترب موعد صلاة ${nxt.n} بعد ${ar(Math.max(1,Math.ceil(remSec/60)))} دقيقة`;
    if(near){
      const key=dk(d)+'_'+nxt.k;
      if(!_prAlertSent[key]){_prAlertSent[key]=true;toast(`تنبيه: اقترب موعد صلاة ${nxt.n}`)}
    }
  },1000);
}

function pickProg(id){U.pc=id;U.pid=null;U.pv=null;if(mob())U.hide=true;render()}
function pickDept(id){U.dept=id;if(mob())U.hide=true;render()}
function myEmpCat(){const me=curEmp(),u=curUser();return (me&&me.cat)||(u&&u.cat)||''}
function pickPerson(id){
  if(isEmpOnly()){
    const p=S.nurses.find(x=>x.id===id),mc=myEmpCat();
    if(p&&mc&&p.cat!==mc){toast('يمكنك عرض الأسماء فقط لباقي الفئات الوظيفية');return}
  }
  U.sel=id;if(mob())U.hide=true;render()
}
function togSide(){const b=document.getElementById('bT'),r1=b.getBoundingClientRect();U.hide=!U.hide;renderSide();
  const r2=b.getBoundingClientRect(),dx=r1.left-r2.left,dy=r1.top-r2.top;
  if(dx||dy){b.style.transition='none';b.style.transform=`translate(${dx}px,${dy}px)`;b.getBoundingClientRect();b.style.transition='transform .4s cubic-bezier(.4,0,.2,1)';b.style.transform=''}}
function placeT(){const t=document.getElementById('bT'),h=document.getElementById(U.hide?'mh':'sh');if(t.parentNode!==h)h.prepend(t)}
function togSearch(){const sx=document.getElementById('sx'),i=document.getElementById('q'),o=sx.classList.toggle('open');if(o)setTimeout(()=>i.focus(),50);else{i.value='';U.q='';renderSide()}}
function togSort(e){e.stopPropagation();document.getElementById('scnm').classList.remove('on');const m=document.getElementById('sm');m.innerHTML=SORTS.map(x=>`<button class="${U.sort===x[0]?'on':''}" onclick="U.sort='${x[0]}';renderSide()">${x[1]}</button>`).join('');m.classList.toggle('on')}
function togScan(e){e.stopPropagation();document.getElementById('sm').classList.remove('on');document.getElementById('scnm').classList.toggle('on')}
document.addEventListener('click',()=>{document.getElementById('sm').classList.remove('on');document.getElementById('scnm').classList.remove('on')});
const dayIdx=p=>{const ds=workDaysOf(p);if(!ds.length)return 99;const idxs=ds.map(d=>DAYS.findIndex(x=>x[0]===d)).filter(i=>i>=0);return idxs.length?Math.min(...idxs):99};
function sorted(a){const r=[...a];if(U.sort==='az')r.sort((x,y)=>x.name.localeCompare(y.name,'ar'));else if(U.sort==='za')r.sort((x,y)=>y.name.localeCompare(x.name,'ar'));else if(U.sort==='day')r.sort((x,y)=>dayIdx(x)-dayIdx(y)||x.name.localeCompare(y.name,'ar'));else r.sort((x,y)=>U.sort==='old'?x.ts-y.ts:y.ts-x.ts);return r}
function match(p,q){const d=dg(q);return [p.name,p.no,p.nid,p.mobile,p.whatsapp,p.workDay].some(v=>norm(v).includes(q)||(d&&dg(v).includes(d)))}

function renderSide(){
  placeT();
  const rec=U.view==='records',el=document.getElementById('dl'),cr=document.getElementById('crumb'),sf=document.getElementById('sf');
  document.getElementById('side').classList.toggle('c',!!U.hide);document.getElementById('side').classList.toggle('ro',U.view==='programs'&&!!U.pv&&!U.pedit);
  document.querySelector('.row').classList.toggle('sbo',!U.hide&&U.view!=='home');
  ['sx','srt','selBtn'].forEach(i=>document.getElementById(i).classList.toggle('off',!rec));
  const sb=document.getElementById('selBtn');if(sb)sb.classList.toggle('pri',rec&&U.selMode);
  if(U.view==='home'){cr.innerHTML='';el.innerHTML='';sf.innerHTML='';return}
  if(U.view==='settings'){
    cr.innerHTML=ic('gear')+' الإعدادات';sf.innerHTML='';
    const it=(i,t,fn,on)=>`<div class="d ${on?'on':''}" onclick="${fn}"><span class="cat">${ic(i)}</span><span class="n">${t}</span></div>`;
    el.innerHTML=it('hosp','اسم المنشأة الطبية',"U.stab='facility';U.about=false;if(mob())U.hide=true;render()",U.stab==='facility')+
      it('key','تغيير كلمة السر',"U.stab='pass';U.about=false;if(mob())U.hide=true;render()",U.stab==='pass')+
      it('shield','حسابات المستخدمين والصلاحيات',"U.stab='users';U.about=false;if(mob())U.hide=true;render()",U.stab==='users')+
      it('db','قاعدة بيانات Firebase',"U.stab='firebase';U.about=false;if(mob())U.hide=true;render()",U.stab==='firebase')+
      '<div style="border-top:1px solid rgba(255,255,255,.7);margin:4px 0"></div>'+
      it('down','حفظ','exp()')+it('print','طباعة','doPrint()')+it('up','استيراد',"if(guard('full','استيراد قاعدة البيانات يتطلب صلاحية التحكم الكلي'))document.getElementById('imp').click()")+
      '<div style="border-top:1px solid rgba(255,255,255,.7);margin:4px 0"></div>'+
      it('hosp','حول التطبيق',"U.stab='about';U.about=true;if(mob())U.hide=true;render()",U.stab==='about'||U.about);
    return;
  }
  if(U.view==='requests'){
    const u=curUser(),mgr=canApproveReq(),all=(S.requests||[]).filter(r=>mgr?true:(r.userId===u.id||(u.empId&&r.empId===u.empId)));
    cr.innerHTML=ic('req')+' نظام الطلبات';sf.innerHTML='';
    const st=[['pending','قيد الانتظار'],['approved','مقبولة'],['rejected','مرفوضة'],['all','كل الطلبات']];
    el.innerHTML=st.map(x=>`<div class="d ${U.rtab===x[0]?'on':''}" onclick="U.rtab='${x[0]}';if(mob())U.hide=true;render()"><span class="cat">${ic('req')}</span><span class="n">${x[1]}</span><small>${ar(x[0]==='all'?all.length:all.filter(r=>r.status===x[0]).length)}</small></div>`).join('');
    return;
  }
  if(U.view==='leaves'){
    const yr=U.ly,lvs=leavesInPeriod(yr,U.lm);
    cr.innerHTML=ic('cal')+' نظام الإجازات';sf.innerHTML='';
    if(isEmpOnly()){
      const me=curEmp(),myLvs=me?lvs.filter(l=>l.emp===me.id):[];
      el.innerHTML=`<div class="d on" onclick="if(mob())U.hide=true;render()"><span class="cat">${ic('user')}</span><span class="n">إجازاتي فقط</span><small>${ar(myLvs.length)}</small></div>`;
      return;
    }
    const al=allLeaveAlerts(yr);

function cleanWa(n){
  let d=norm(n).replace(/[^\d]/g,'');
  if(d.startsWith('00'))d=d.slice(2);
  if(/^09\d{8}$/.test(d))d='963'+d.slice(1);
  return d;
}

const LV=[
  ['paid','إجازة بأجر',0],
  ['unpaid','إجازة بلا أجر',0],
  ['paidsub','إجازة بأجر مع تأمين بديل',1],
  ['unpaidsub','إجازة بلا أجر مع بديل',1],
  ['absence','غياب',0],
  ['delay','تأخير',0]
];
const lvName=t=>(LV.find(x=>x[0]===t)||[0,t])[1];
const empCaps=id=>{const e=S.nurses.find(x=>x.id===id);return{
  maxPaid:(e&&e.maxPaid!==''&&e.maxPaid!=null&&!isNaN(+e.maxPaid))?Math.max(0,+e.maxPaid):(+S.leaveCfg.maxPaid||15),
  maxUnpaid:(e&&e.maxUnpaid!==''&&e.maxUnpaid!=null&&!isNaN(+e.maxUnpaid))?Math.max(0,+e.maxUnpaid):(+S.leaveCfg.maxUnpaid||10)
}};
function eachDay(from,to,fn){
  if(!from||!to||to<from)return;
  const d=pdate(from),end=pdate(to);let guard=0;
  while(d<=end&&guard++<400){fn(dk(d));d.setDate(d.getDate()+1)}
}
function evalAnnualLeaves(empId,year){
  const caps=empCaps(empId),yPre=String(year)+'-';
  const res={empId,year,maxPaid:caps.maxPaid,maxUnpaid:caps.maxUnpaid,usedPaid:0,usedUnpaid:0,usedAbsence:0,usedDelay:0,delayMins:0,convToUnpaid:0,convToAbsence:0,counts:{paid:0,unpaid:0,paidsub:0,unpaidsub:0,absence:0,delay:0},byDay:{},byLeave:{},alert:false};
  const lvs=S.leaves.filter(l=>l.emp===empId&&(l.from.startsWith(yPre)||l.to.startsWith(yPre)||(l.from<yPre+'01-01'&&l.to>=yPre+'01-01'))).sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:(a.ts||0)-(b.ts||0));
  lvs.forEach(l=>{
    const bl={totalDays:0,counts:{paid:0,unpaid:0,paidsub:0,unpaidsub:0,absence:0,delay:0},convToUnpaid:0,convToAbsence:0};
    res.byLeave[l.id]=bl;
    eachDay(l.from,l.to,k=>{
      if(!k.startsWith(yPre))return;
      bl.totalDays++;
      let eff=l.type,conv='';
      if(l.type==='paid'||l.type==='paidsub'){
        if(res.usedPaid<caps.maxPaid){res.usedPaid++}
        else{
          const up=l.type==='paidsub'?'unpaidsub':'unpaid';
          if(res.usedUnpaid<caps.maxUnpaid){eff=up;res.usedUnpaid++;res.convToUnpaid++;bl.convToUnpaid++;conv='to_unpaid'}
          else{eff='absence';res.usedAbsence++;res.convToUnpaid++;res.convToAbsence++;bl.convToUnpaid++;bl.convToAbsence++;conv='to_absence'}
        }
      }else if(l.type==='unpaid'||l.type==='unpaidsub'){
        if(res.usedUnpaid<caps.maxUnpaid){res.usedUnpaid++}
        else{eff='absence';res.usedAbsence++;res.convToAbsence++;bl.convToAbsence++;conv='to_absence'}
      }else if(l.type==='absence'){
        res.usedAbsence++;
      }else if(l.type==='delay'){
        res.usedDelay++;res.delayMins+=(+l.mins||0);
      }
      res.counts[eff]=(res.counts[eff]||0)+1;
      bl.counts[eff]=(bl.counts[eff]||0)+1;
      res.byDay[k]={leave:l,id:l.id,emp:l.emp,origType:l.type,type:eff,effType:eff,converted:conv,sub:eff==='absence'?'':(l.sub||''),mins:+l.mins||0};
    });
  });
  res.alert=(res.usedUnpaid>=caps.maxUnpaid&&res.usedUnpaid>0)||res.convToAbsence>0;
  return res;
}
function allLeaveAlerts(year){
  return S.nurses.map(emp=>({emp,ev:evalAnnualLeaves(emp.id,year)})).filter(x=>x.ev.alert);
}
function leavesInPeriod(year,month){
  const yPre=String(year)+'-';
  const mPre=month==='all'?yPre:`${year}-${pad(+month+1)}-`;
  return S.leaves.filter(l=>{
    if(!exists(l.emp))return false;
    let hit=false;
    eachDay(l.from,l.to,k=>{if(k.startsWith(mPre))hit=true});
    return hit;
  }).sort((a,b)=>b.from.localeCompare(a.from));
}
const tm=t=>{const[a,b]=t.split(':');return (+a)*60+(+b)};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const fT=t=>{let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return m?`${h}:${pad(m)} ${ap}`:`${h} ${ap}`};
const dLab=d=>`${fT(d.from)} - ${fT(d.to)}`;
const dMin=d=>((tm(d.to)-tm(d.from))+1440)%1440||1440;
const fH=min=>ar(+(min/60).toFixed(2))+' س';
const byName=a=>[...a].sort((x,y)=>x.name.localeCompare(y.name,'ar'));

const exists=id=>S.nurses.some(x=>x.id===id);

function tplOf(P,wd){return P.tpl[wd]||(P.tpl[wd]={divs:defDivs(),depts:[]})}
const Lview=(P,k)=>P.ovr[k]||tplOf(P,dayName(pdate(k)));
const modeOf=(P,k)=>P.ovr[k]?'date':U.scope;
function edit(fn){if(!U.pedit)return;const P=progOf(),k=U.pday,wd=dayName(pdate(k));let L;
  if(modeOf(P,k)==='date')L=P.ovr[k]||(P.ovr[k]=cl(tplOf(P,wd)));else L=tplOf(P,wd);
  fn(L,P);save();render()}
const onLeave=(P,id,k)=>evalAnnualLeaves(id,P?P.y:+k.slice(0,4)).byDay[k]||null;
const effOf=(P,k,a)=>{const l=onLeave(P,a,k);if(!l)return a;if(l.effType==='delay')return a;return l.sub||null};
const DD=(L,id)=>L.depts.find(d=>d.id===id);

function stats(P){
  const R={},g=id=>R[id]||(R[id]={h:0,sh:0,days:new Set(),daily:{},delayMins:0,lv:{paid:0,unpaid:0,paidsub:0,unpaidsub:0,absence:0,delay:0}}),n=new Date(P.y,P.m+1,0).getDate();
  const evalCache={},evOf=id=>evalCache[id]||(evalCache[id]=evalAnnualLeaves(id,P.y));
  for(let d=1;d<=n;d++){const k=dk(new Date(P.y,P.m,d)),L=Lview(P,k);
    L.depts.forEach(dep=>dep.rows.forEach(r=>Object.entries(r.c).forEach(([dv,a])=>{
      const D=L.divs.find(x=>x.id===dv);if(!D||!exists(a))return;
      const lv=evOf(a).byDay[k];
      const w=!lv||lv.effType==='delay'?a:(lv.sub||null);
      if(!w||!exists(w))return;
      const o=g(w),m=dMin(D);o.h+=m;o.sh++;o.days.add(k);o.daily[k]=(o.daily[k]||0)+m})))}
  const mPre=`${P.y}-${pad(P.m+1)}-`;
  const empIds=new Set(Object.keys(R));
  Object.values(P.wd).forEach(l=>l.forEach(i=>empIds.add(i)));
  S.leaves.forEach(l=>{if(exists(l.emp))empIds.add(l.emp)});
  empIds.forEach(id=>{
    if(!exists(id))return;
    const ev=evOf(id);
    Object.entries(ev.byDay).forEach(([k,info])=>{
      if(!k.startsWith(mPre))return;
      const o=g(id);
      o.lv[info.effType]=(o.lv[info.effType]||0)+1;
      if(info.effType==='delay'&&info.mins>0){
        o.delayMins+=info.mins;
        if(o.daily[k]){const ded=Math.min(o.daily[k],info.mins);o.daily[k]-=ded;o.h=Math.max(0,o.h-ded)}
      }
    });
  });
  return R}

function blocks(){
  const wd=DAYS[U.tab][1],ds=datesOf(wd),shown=S.depts.filter(d=>U.dept==='all'||d.id===U.dept);
  if(!shown.length)return '<div class="emp">لا توجد أقسام. أضف قسماً من القائمة الجانبية.</div>';
  const opts=sel=>`<option value="">—</option>`+S.nurses.filter(n=>n.cat==='nursing').map(n=>`<option value="${n.id}" ${n.id===sel?'selected':''}>${esc(n.name)}</option>`).join('');
  return ds.map((dt,di)=>{
    // كشف التعارض: نفس الممرض في نفس الوردية بأكثر من موضع
    const c={};Object.entries(S.sched).forEach(([k,v])=>{const p=k.split('|');if(p[0]===dt&&v){const q=p[2]+'|'+v;c[q]=(c[q]||0)+1}});
    let h=`<div class="blk"><div class="bh">${ic('cal')} ${DAYS[U.tab][0]} ${fmt(dt)}<span style="flex:1"></span>${di>0?`<button class="ib sm" onclick="cp('${ds[di-1]}','${dt}')">نسخ من ${fmt(ds[di-1])}</button>`:''}<button class="ib sm dng" onclick="clr('${dt}')">مسح</button></div>
    <table><thead><tr><th class="f">القسم / الموضع</th>${SHIFTS.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>`;
    shown.forEach(d=>{
      h+=`<tr class="band"><td colspan="7">${esc(d.name)}</td></tr>`;
      for(let s=0;s<d.slots;s++){
        h+=`<tr><td class="sl">عنصر ${ar(s+1)}</td>`;
        SHIFTS.forEach((_,sh)=>{const k=`${dt}|${d.id}|${sh}|${s}`,v=S.sched[k]||'',bad=v&&c[sh+'|'+v]>1;
          h+=`<td class="${bad?'x':v?'v':''}" ${bad?'title="مُسنَد في أكثر من قسم بنفس الوردية"':''}><select onchange="setc('${k}',this.value)">${opts(v)}</select></td>`});
        h+='</tr>';}
    });
    return h+'</tbody></table></div>';
  }).join('')||'<div class="emp">لا توجد أيام</div>';
}

function summary(){
  const pre=`${U.y}-${pad(U.m+1)}`,T={};
  Object.entries(S.sched).forEach(([k,v])=>{if(!v||!k.startsWith(pre))return;const d=k.split('|')[1];(T[v]=T[v]||{})[d]=(T[v][d]||0)+1});
  return `<div class="blk sum"><div class="bh">${ic('chart')} ملخص ${MONTHS[U.m]} ${ar(U.y)} (كل وردية = ٤ ساعات)</div><table><thead><tr><th class="f">الاسم</th>${S.depts.map(d=>`<th>${esc(d.name)}</th>`).join('')}<th>الورديات</th><th>الساعات</th></tr></thead><tbody>`+
   S.nurses.filter(n=>n.cat==='nursing').map(n=>{const t=T[n.id]||{},tot=Object.values(t).reduce((a,b)=>a+b,0);
     return `<tr><td>${esc(n.name)}${n.role?` <small style="color:var(--mu)">(${esc(n.role)})</small>`:''}</td>${S.depts.map(d=>`<td>${t[d.id]?ar(t[d.id]):'—'}</td>`).join('')}<td><b>${ar(tot)}</b></td><td><b>${ar(tot*4)}</b></td></tr>`}).join('')+'</tbody></table></div>';
}

function setc(k,v){if(v)S.sched[k]=v;else delete S.sched[k];save();render()}
function cp(from,to){clr(to,1);Object.entries(S.sched).forEach(([k,v])=>{if(k.startsWith(from+'|'))S.sched[to+k.slice(from.length)]=v});save();render()}
function clr(dt,q){const run=()=>{Object.keys(S.sched).forEach(k=>{if(k.startsWith(dt+'|'))delete S.sched[k]});save();if(!q)render()};q?run():ask('مسح جدول هذا اليوم؟',run)}

function onShiftTypeChange(){
  const sel=document.getElementById('f_st');if(!sel)return;
  const v=sel.value,stn=document.getElementById('f_stn');
  if(stn)stn.style.display=v==='__new'?'block':'none';
  const multi=isMultiShift(v),sW=document.getElementById('f_day_s'),mW=document.getElementById('f_day_m'),h=document.getElementById('f_day_hint');
  if(sW)sW.style.display=multi?'none':'block';
  if(mW)mW.style.display=multi?'block':'none';
  if(h)h.textContent=v==='نظام ٣٠ ساعة (مناوبة + يوم إداري)'?'(اختر يوم المناوبة + اليوم الإداري)':'(يمكنك اختيار أكثر من يوم)';
  if(multi){
    const cur=document.getElementById('f_day')?.value;
    if(cur&&![...document.querySelectorAll('.f_mchk:checked')].length){
      const cb=[...document.querySelectorAll('.f_mchk')].find(x=>x.value===cur);
      if(cb)cb.checked=true;
    }
  }else{
    const first=[...document.querySelectorAll('.f_mchk:checked')][0]?.value;
    const sd=document.getElementById('f_day');
    if(sd&&!sd.value&&first)sd.value=first;
  }
}
function wsync(){const c=document.getElementById('f_same');if(!c)return;const w=document.getElementById('f_wa');if(c.checked){w.value=document.getElementById('f_mob').value;w.readOnly=true}else w.readOnly=false}
function empSave(id){
  const g=i=>document.getElementById(i).value.trim();
  let st=g('f_st');if(st==='__new')st=g('f_stn');
  const wdVal=isMultiShift(st)?[...document.querySelectorAll('.f_mchk:checked')].map(x=>x.value).join('، '):g('f_day');
  const mp=g('f_mp'),mu=g('f_mu'),enName=g('f_ename');
  const d={cat:g('f_cat'),nid:g('f_nid'),name:g('f_name'),enName,role:g('f_role'),home:g('f_home'),mobile:g('f_mob'),whatsapp:g('f_wa'),email:g('f_mail'),shiftType:st,workDay:wdVal,maxPaid:mp===''?'':Math.max(0,+mp||0),maxUnpaid:mu===''?'':Math.max(0,+mu||0)};
  const old=S.nurses.find(x=>x.id===id)||null,er=document.getElementById('f_err');
  document.querySelectorAll('.md .bad').forEach(e=>e.classList.remove('bad'));
  // عند تعديل سجل قديم: الحقل المطلوب الذي كان فارغاً أصلاً لا يمنع الحفظ
  const miss=[['name','الاسم الثلاثي','f_name'],['role','الصفة الوظيفية','f_role'],['mobile','رقم الموبايل','f_mob'],['whatsapp','رقم الواتساب','f_wa'],['shiftType','نوع الدوام','f_st']].filter(x=>!d[x[0]]&&!(old&&!old[x[0]]));
  const fail=m=>{er.textContent=m;er.scrollIntoView({block:'nearest',behavior:'smooth'})};
  if(miss.length){miss.forEach(x=>document.getElementById(x[2]).classList.add('bad'));return fail('الحقول المطلوبة: '+miss.map(x=>x[1]).join('، '))}
  if(d.name.split(/\s+/).length<3&&!(old&&old.name===d.name)){document.getElementById('f_name').classList.add('bad');return fail('يرجى إدخال الاسم الثلاثي كاملاً')}
  if(d.email&&!/^\S+@\S+\.\S+$/.test(d.email)){document.getElementById('f_mail').classList.add('bad');return fail('البريد الإلكتروني غير صالح')}
  if(!S.shiftTypes.includes(st))S.shiftTypes.push(st);
  let createdUn='';
  if(id){
    Object.assign(S.nurses.find(x=>x.id===id),d);
    const lu=(S.users||[]).find(x=>x.empId===id);
    if(lu){lu.name=d.name;lu.cat=d.cat}
    else if(d.enName){
      const un=d.enName.trim();
      if(!(S.users||[]).some(x=>x.username.toLowerCase()===un.toLowerCase())){
        S.users.push({id:uid(),empId:id,name:d.name,username:un,pass:un,role:'employee',cat:d.cat,perms:cl(ROLES[4][2]),ts:Date.now()});
        createdUn=un;
      }
    }
    pushNotif(`تعديل بيانات العنصر «${d.name}»`,'admins','info');
  }else{
    const n={id:uid(),no:++S.seq,ts:Date.now(),...d};S.nurses.push(n);U.sel=n.id;
    const baseUn=(d.enName||'').trim()||('emp'+n.no);
    let un=baseUn,k=2;
    while((S.users||[]).some(x=>x.username.toLowerCase()===un.toLowerCase()))un=baseUn+k++;
    S.users.push({id:uid(),empId:n.id,name:n.name,username:un,pass:un,role:'employee',cat:n.cat,perms:cl(ROLES[4][2]),ts:Date.now()});
    createdUn=un;
    pushNotif(`إضافة عنصر جديد «${n.name}» وإنشاء حساب دخول (@${un})`,'admins','ok');
  }
  save();closeM();render();
  if(createdUn)toast(`تم إنشاء حساب للموظف — المستخدم وكلمة السر: ${createdUn}`);
}

}

let _t=null;
document.addEventListener('touchstart',e=>{const t=e.touches[0];_t=e.touches.length===1&&!e.target.closest('table,.xs,.wkw,.tabs,.ptabs,input,select,textarea,.md')?{x:t.clientX,y:t.clientY,t:Date.now()}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!_t)return;const t=e.changedTouches[0],dx=t.clientX-_t.x,dy=t.clientY-_t.y,dt=Date.now()-_t.t;_t=null;
  if(dx>80&&Math.abs(dy)<dx*.5&&dt<700&&goBack())backHint()},{passive:true});
/* ===== Enter في النوافذ = الحقل التالي ===== */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;const t=e.target;
  if(!t.matches||!t.matches('.md input')||t.type==='checkbox')return;
  e.preventDefault();const md=t.closest('.md');
  const f=[...md.querySelectorAll('input,select,textarea')].filter(x=>!x.disabled&&!x.readOnly&&x.type!=='hidden'&&x.offsetParent!==null);
  const n=f[f.indexOf(t)+1];
  if(n){n.focus();if(n.tagName==='INPUT'&&!['date','time','checkbox'].includes(n.type)){try{n.select()}catch(x){}}}
  else{const b=md.querySelector('.act .ib.pri');if(b)b.click()}
});

/* ===== التحديد المتعدد وتحديد الكل في القائمة الجانبية ===== */
function curRecList(){
  if(U.view!=='records')return [];
  const q=norm(U.q.trim());
  if(q)return sorted(S.nurses.filter(p=>(!U.cat||p.cat===U.cat)&&match(p,q)));
  if(!U.cat)return [];
  return sorted(S.nurses.filter(p=>p.cat===U.cat));
}
function togSelectMode(){
  if(U.view!=='records')return;
  const list=curRecList();
  if(!U.cat&&!U.q.trim())return toast('اختر سجلاً أولاً لعرض العناصر وتحديدها');
  if(!list.length)return toast('لا توجد عناصر للتحديد');
  if(!U.selMode){U.selMode=true;U.checked=[];renderSide();return}
  const allSel=list.every(p=>U.checked.includes(p.id));
  if(!allSel){U.checked=list.map(p=>p.id);renderSide()}
  else{U.checked=[];U.selMode=false;renderSide()}
}
function togItemCheck(id,e){
  if(e)e.stopPropagation();
  const i=U.checked.indexOf(id);
  if(i>=0)U.checked.splice(i,1);else U.checked.push(id);
  renderSide();
}
function togSelectAll(){
  const list=curRecList();
  if(!list.length)return;
  const allSel=list.every(p=>U.checked.includes(p.id));
  U.checked=allSel?[]:list.map(p=>p.id);
  renderSide();
}
function exitSelectMode(){U.selMode=false;U.checked=[];renderSide()}
function delSelected(){if(!guard('emp','del'))return;
  const ids=U.checked.filter(id=>S.nurses.some(n=>n.id===id));
  if(!ids.length)return;
  ask(`حذف ${ar(ids.length)} عنصر محدد وجميع تعييناتهم؟`,()=>{
    const rm=new Set(ids);
    S.nurses=S.nurses.filter(n=>!rm.has(n.id));
    if(rm.has(U.sel))U.sel=null;
    S.leaves=(S.leaves||[]).filter(l=>!rm.has(l.emp)&&!rm.has(l.sub));
    S.programs.forEach(p=>{
      Object.keys(p.wd).forEach(k=>p.wd[k]=p.wd[k].filter(x=>!rm.has(x)));
      p.leaves=(p.leaves||[]).filter(l=>!rm.has(l.emp)&&!rm.has(l.sub));
      [...Object.values(p.tpl||{}),...Object.values(p.ovr||{})].forEach(L=>L.depts.forEach(d=>d.rows.forEach(r=>Object.keys(r.c).forEach(k=>{if(rm.has(r.c[k]))delete r.c[k]}))));
    });
    Object.keys(S.sched).forEach(k=>{if(rm.has(S.sched[k]))delete S.sched[k]});
    pushNotif(`حذف ${ar(ids.length)} عنصر من السجلات`,'admins','dng');
    U.checked=[];U.selMode=false;save();render();toast(`تم حذف ${ar(ids.length)} عنصر`);
  });
}

/* ===== المسح الإلكتروني (الكاميرا / إدراج ملف) ===== */
let _camStream=null,_scanRows=[],_scanRaw='',_scanImg='';
const _loadedScripts={};
function loadScript(src){
  if(_loadedScripts[src])return _loadedScripts[src];
  _loadedScripts[src]=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=src;s.async=true;
    s.onload=()=>res();s.onerror=()=>rej(new Error('load failed'));
    document.head.appendChild(s);
  });
  return _loadedScripts[src];
}
function stopCam(){
  if(_camStream){try{_camStream.getTracks().forEach(t=>t.stop())}catch(e){}_camStream=null}
}
function openFileScan(){if(!guard('emp','add'))return;
  document.getElementById('scnm').classList.remove('on');
  const inp=document.getElementById('scanFile');
  inp.value='';inp.click();
}
function openCamScan(){if(!guard('emp','add'))return;
  document.getElementById('scnm').classList.remove('on');
  modal(`<h3>${ic('cam')} المسح بالكاميرا</h3>
    <div id="cam_wrap"><video id="cam_v" class="scan-vid" autoplay playsinline muted></video></div>
    <div id="cam_msg" style="font-size:12px;color:var(--mu);margin-top:8px">وجّه الكاميرا نحو المستند أو جدول الإكسل ثم اضغط «التقاط ومسح».</div>
    <div class="act">
      <button class="ib pri" id="cam_cap" onclick="captureCam()">${ic('cam')} التقاط ومسح</button>
      <button class="ib" onclick="closeM();document.getElementById('scanCamInput').click()">${ic('file')} كاميرا الجهاز</button>
      <span style="flex:1"></span>
      <button class="ib" onclick="closeM()">إلغاء</button>
    </div>`);
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})
      .then(st=>{
        _camStream=st;
        const v=document.getElementById('cam_v');
        if(v){v.srcObject=st}else{stopCam()}
      })
      .catch(()=>{
        const m=document.getElementById('cam_msg'),w=document.getElementById('cam_wrap'),b=document.getElementById('cam_cap');
        if(w)w.innerHTML='<div class="emp" style="padding:20px 10px">تعذر فتح الكاميرا مباشرة. يمكنك استخدام زر «كاميرا الجهاز» أدناه لالتقاط صورة.</div>';
        if(m)m.textContent='';
        if(b)b.disabled=true;
      });
  }else{
    const w=document.getElementById('cam_wrap'),b=document.getElementById('cam_cap');
    if(w)w.innerHTML='<div class="emp" style="padding:20px 10px">المتصفح لا يدعم البث المباشر للكاميرا هنا. اضغط «كاميرا الجهاز» لالتقاط صورة.</div>';
    if(b)b.disabled=true;
  }
}
function captureCam(){
  const v=document.getElementById('cam_v');
  if(!v||!v.videoWidth)return toast('انتظر لحظة حتى تجهز الكاميرا');
  const c=document.createElement('canvas');
  c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  const dataUrl=c.toDataURL('image/jpeg',0.92);
  closeM();
  processImageForScan(dataUrl,'لقطة الكاميرا');
}
function handleScanFile(e){
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f)return;
  const name=f.name||'',ext=name.split('.').pop().toLowerCase();
  if(f.type.startsWith('image/')||['png','jpg','jpeg','webp','bmp','gif'].includes(ext)){
    const r=new FileReader();
    r.onload=()=>processImageForScan(r.result,name);
    r.readAsDataURL(f);
    return;
  }
  if(['csv','txt','tsv'].includes(ext)||f.type.startsWith('text/')){
    const r=new FileReader();
    r.onload=()=>{
      const txt=String(r.result||'').replace(/^\uFEFF/,'');
      const rows=parseDelimitedOrText(txt);
      showScanReview(rows,name,txt,'');
    };
    r.readAsText(f,'UTF-8');
    return;
  }
  if(['xlsx','xls'].includes(ext)){
    const ov=modal(`<h3>${ic('scan')} قراءة ملف الإكسل</h3><div style="font-size:13px;color:var(--mu)">جارٍ تحليل الملف: <b>${esc(name)}</b>…</div><div class="scan-bar"><i style="width:45%"></i></div>`);
    loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js').then(()=>{
      const r=new FileReader();
      r.onload=()=>{
        try{
          const wb=window.XLSX.read(new Uint8Array(r.result),{type:'array'});
          const ws=wb.Sheets[wb.SheetNames[0]];
          const matrix=window.XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
          const rows=parseMatrixRows(matrix);
          if(ov.parentNode)ov.remove();
          showScanReview(rows,name,matrix.map(rw=>rw.join('\t')).join('\n'),'');
        }catch(err){
          if(ov.parentNode)ov.remove();
          toast('تعذر قراءة ملف الإكسل');
          showScanReview([],name,'','');
        }
      };
      r.readAsArrayBuffer(f);
    }).catch(()=>{
      if(ov.parentNode)ov.remove();
      toast('تعذر تحميل قارئ الإكسل (تأكد من الاتصال بالإنترنت أو احفظ الملف كـ CSV)');
      showScanReview([],name,'','');
    });
    return;
  }
  toast('صيغة الملف غير مدعومة. اختر صورة أو ملف إكسل (xlsx/xls/csv/txt)');
}
function processImageForScan(dataUrl,label){
  _scanImg=dataUrl;
  const ov=modal(`<h3>${ic('scan')} المسح الضوئي للصورة</h3>
    <img class="scan-prev" src="${dataUrl}" alt="معاينة">
    <div id="ocr_st" style="font-size:13px;color:var(--mu)">جارٍ تجهيز محرك القراءة الضوئية (عربي / إنجليزي)…</div>
    <div class="scan-bar"><i id="ocr_p" style="width:12%"></i></div>
    <div class="act"><button class="ib" onclick="closeM();showScanReview([], '${esc(label||'صورة')}', '', _scanImg)">إدخال / لصق يدوي</button><span style="flex:1"></span><button class="ib" onclick="closeM()">إلغاء</button></div>`);
  let aborted=false;
  const checkOpen=()=>!!ov.parentNode;
  loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js').then(()=>{
    if(!checkOpen()){aborted=true;return}
    return window.Tesseract.recognize(dataUrl,'ara+eng',{
      logger:m=>{
        if(!checkOpen())return;
        const st=document.getElementById('ocr_st'),pr=document.getElementById('ocr_p');
        if(st&&m.status){
          const pct=Math.round((m.progress||0)*100);
          st.textContent=m.status==='recognizing text'?`جارٍ استخراج أسماء العناصر من الصورة… ${ar(pct)}%`:`جارٍ تحميل بيانات اللغة… ${ar(pct)}%`;
          if(pr)pr.style.width=Math.max(15,pct)+'%';
        }
      }
    });
  }).then(res=>{
    if(aborted||!checkOpen()||!res)return;
    const raw=(res.data&&res.data.text)||'';
    const rows=parseDelimitedOrText(raw);
    ov.remove();
    showScanReview(rows,label||'صورة ممسوحة',raw,dataUrl);
  }).catch(()=>{
    if(!checkOpen())return;
    ov.remove();
    toast('تعذر تشغيل المسح التلقائي (تأكد من الاتصال) — يمكنك لصق الأسماء يدوياً');
    showScanReview([],label||'صورة', '', dataUrl);
  });
}
function cleanCell(v){return String(v==null?'':v).replace(/^["']+|["']+$/g,'').replace(/\s+/g,' ').trim()}
function isHeaderWord(s){return /^(الاسم|الاسم الثلاثي|اسم الموظف|الموظف|العنصر|الأسماء|name|full\s*name|employee|م|ت|#|الرقم|تسلسل)$/i.test(s)}
function parseMatrixRows(matrix){
  if(!matrix||!matrix.length)return [];
  const rows=matrix.map(r=>(Array.isArray(r)?r:[r]).map(cleanCell)).filter(r=>r.some(Boolean));
  if(!rows.length)return [];
  let nameCol=-1,roleCol=-1,mobCol=-1,nidCol=-1,start=0;
  const h=rows[0];
  h.forEach((c,i)=>{
    if(/الاسم|الموظف|العنصر|name/i.test(c)&&nameCol<0)nameCol=i;
    else if(/الصفة|المسمى|الوظيف|role|title|job/i.test(c)&&roleCol<0)roleCol=i;
    else if(/موبايل|هاتف|جوال|رقم الهاتف|phone|mobile/i.test(c)&&mobCol<0)mobCol=i;
    else if(/الوطني|هوية|nid|national/i.test(c)&&nidCol<0)nidCol=i;
  });
  if(nameCol>=0||h.some(isHeaderWord)){start=1;if(nameCol<0)nameCol=0}
  else{
    const maxCols=Math.max(...rows.map(r=>r.length));
    let best=0,bestScore=-1;
    for(let c=0;c<maxCols;c++){
      let sc=0;
      rows.forEach(r=>{const v=r[c]||'';if(v&&!/^\d+$/.test(v)&&/[\u0600-\u06FFa-zA-Z]/.test(v))sc++});
      if(sc>bestScore){bestScore=sc;best=c}
    }
    nameCol=best;
  }
  const out=[];
  for(let i=start;i<rows.length;i++){
    const r=rows[i];
    let nm=(r[nameCol]||'').replace(/^[\d٠-٩]+[\s.\-\)\/]+/,'').trim();
    if(!nm||isHeaderWord(nm)||/^[\d٠-٩\s\-_.]+$/.test(nm))continue;
    out.push({on:true,name:nm,role:roleCol>=0?(r[roleCol]||''):'',mobile:mobCol>=0?(r[mobCol]||''):'',nid:nidCol>=0?(r[nidCol]||''):''});
  }
  return out;
}
function parseDelimitedOrText(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return [];
  const hasTab=lines.some(l=>l.includes('\t'));
  const hasComma=lines.some(l=>l.includes(',')||l.includes(';')||l.includes('،'));
  const matrix=lines.map(l=>{
    if(hasTab)return l.split('\t');
    if(hasComma)return l.split(/[,;،]/);
    if(/\s{2,}|\|/.test(l))return l.split(/\s{2,}|\|/);
    return [l];
  });
  return parseMatrixRows(matrix);
}
function showScanReview(rows,sourceName,rawText,imgUrl){
  _scanRows=rows.length?rows:[];
  _scanRaw=rawText||'';
  _scanImg=imgUrl||'';
  const cs=CATS.map(c=>`<option value="${c[0]}" ${c[0]===(U.cat||'nursing')?'selected':''}>${c[1]}</option>`).join('');
  const st=S.shiftTypes.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
  const ov=modal(`<h3>${ic('scan')} مراجعة وإدراج العناصر</h3>
    <div style="font-size:12px;color:var(--mu);margin-bottom:8px">المصدر: <b>${esc(sourceName||'ملف ممسوح')}</b> — راجع الأسماء المستخرجة وعدّلها قبل الإدراج في القائمة.</div>
    ${_scanImg?`<img class="scan-prev" src="${_scanImg}" alt="الصورة الممسوحة">`:''}
    <div class="fg">
      <div><label>السجل المستهدف</label><select id="sc_cat">${cs}</select></div>
      <div><label>نوع الدوام الافتراضي</label><select id="sc_st">${st}</select></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap">
      <button class="ib sm" onclick="addScanRow()">${ic('plus')} إضافة صف</button>
      <button class="ib sm" onclick="togRawBox()">${ic('edit')} لصق / تعديل النص الخام</button>
      <span style="flex:1"></span>
      <span id="sc_cnt" style="font-size:12px;font-weight:700;color:var(--pd)"></span>
    </div>
    <div id="sc_raw_wrap" style="display:${_scanRows.length?'none':'block'};margin-top:8px">
      <label style="margin-top:0">أدخل أو الصق الأسماء (اسم في كل سطر، أو منسوخة من إكسل)</label>
      <textarea id="sc_raw" placeholder="مثال:&#10;أحمد محمد العلي&#10;سارة خالد الحسن">${esc(_scanRaw)}</textarea>
      <div class="act" style="margin-top:6px"><button class="ib sm pri" onclick="parseRawIntoScan()">تحليل النص إلى صفوف</button></div>
    </div>
    <div class="scan-tbl" id="sc_tbl"></div>
    <div class="act"><button class="ib pri" id="sc_go" onclick="importScannedRows()">إدراج في القائمة</button><button class="ib" onclick="closeM()">إلغاء</button></div>`);
  ov.querySelector('.md').classList.add('wide');
  renderScanRows();
}
function togRawBox(){
  const w=document.getElementById('sc_raw_wrap');
  if(w)w.style.display=w.style.display==='none'?'block':'none';
}
function parseRawIntoScan(){
  const t=document.getElementById('sc_raw');if(!t)return;
  const parsed=parseDelimitedOrText(t.value);
  if(!parsed.length)return toast('لم يتم العثور على أسماء صالحة في النص');
  _scanRows=parsed;
  document.getElementById('sc_raw_wrap').style.display='none';
  renderScanRows();
}
function addScanRow(){
  _scanRows.push({on:true,name:'',role:'',mobile:'',nid:''});
  renderScanRows();
}
function renderScanRows(){
  const el=document.getElementById('sc_tbl'),cnt=document.getElementById('sc_cnt'),btn=document.getElementById('sc_go');
  if(!el)return;
  const allOn=_scanRows.length&&_scanRows.every(r=>r.on);
  const selCount=_scanRows.filter(r=>r.on&&r.name.trim()).length;
  if(cnt)cnt.textContent=`جاهز للإدراج: ${ar(selCount)}`;
  if(btn){btn.disabled=!selCount;btn.textContent=`إدراج المحدد في القائمة (${ar(selCount)})`}
  if(!_scanRows.length){
    el.innerHTML='<div class="emp" style="padding:18px 10px;font-size:13px">لا توجد أسماء مستخرجة بعد. الصق الأسماء في المربع أعلاه أو أضف صفاً يدوياً.</div>';
    return;
  }
  el.innerHTML=`<div class="scan-row hd"><input type="checkbox" ${allOn?'checked':''} onchange="_scanRows.forEach(r=>r.on=this.checked);renderScanRows()" aria-label="تحديد الكل"><span>الاسم</span><span class="opt">الصفة الوظيفية</span><span class="opt">الموبايل</span><span></span></div>`+
    _scanRows.map((r,i)=>`<div class="scan-row">
      <input type="checkbox" ${r.on?'checked':''} onchange="_scanRows[${i}].on=this.checked;renderScanRows()">
      <input type="text" value="${esc(r.name)}" placeholder="الاسم" oninput="_scanRows[${i}].name=this.value;updateScanCount()">
      <input type="text" class="opt" value="${esc(r.role||'')}" placeholder="الصفة" oninput="_scanRows[${i}].role=this.value">
      <input type="text" class="opt" dir="ltr" value="${esc(r.mobile||'')}" placeholder="الموبايل" oninput="_scanRows[${i}].mobile=this.value">
      <button class="ib sm dng" title="حذف الصف" onclick="_scanRows.splice(${i},1);renderScanRows()">${ic('x')}</button>
    </div>`).join('');
}
function updateScanCount(){
  const selCount=_scanRows.filter(r=>r.on&&r.name.trim()).length;
  const cnt=document.getElementById('sc_cnt'),btn=document.getElementById('sc_go');
  if(cnt)cnt.textContent=`جاهز للإدراج: ${ar(selCount)}`;
  if(btn){btn.disabled=!selCount;btn.textContent=`إدراج المحدد في القائمة (${ar(selCount)})`}
}
function importScannedRows(){
  const cat=gv('sc_cat')||'nursing',st=gv('sc_st')||(S.shiftTypes[0]||'مناوبات');
  const valid=_scanRows.filter(r=>r.on&&r.name.trim());
  if(!valid.length)return toast('لا توجد أسماء محددة للإدراج');
  const baseTs=Date.now();
  valid.forEach((r,idx)=>{
    const mob=r.mobile?r.mobile.trim():'';
    S.nurses.push({
      id:uid(),no:++S.seq,ts:baseTs+idx,cat,
      name:r.name.trim(),role:(r.role||'').trim(),
      nid:(r.nid||'').trim(),home:'',mobile:mob,whatsapp:mob,
      email:'',shiftType:st,workDay:''
    });
  });
  save();closeM();
  U.view='records';U.cat=cat;U.hide=false;U.selMode=false;U.checked=[];
  render();
  toast(`تم إدراج ${ar(valid.length)} عنصر إلى سجل ${catName(cat)}`);
}

if(U.tab<0)U.tab=0;
render();
if(FB.url&&FB.connected){
  syncFromFirebase().then(()=>{
    if(U.user&&!(S.users||[]).some(x=>x.id===U.user)){U.user=null;try{localStorage.removeItem(AUTH_KEY)}catch(e){}}
    render();
  }).catch(()=>{setSyncUi('err','تعذر الاتصال')});
}
